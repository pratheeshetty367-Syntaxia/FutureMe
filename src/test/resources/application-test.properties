# Used only by automated tests (profile "test"): an in-memory H2 database,
# so `mvnw clean test` works even when MySQL is not running.
spring.datasource.url=jdbc:h2:mem:futureme_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
