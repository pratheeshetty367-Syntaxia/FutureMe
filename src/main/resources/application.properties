# ---------- Application ----------
spring.application.name=futureme
server.port=8080
 
# ---------- MySQL connection ----------
# The database PASSWORD is deliberately NOT written here.
# Put it in src/main/resources/local.properties (ignored by Git), see the guide.
spring.datasource.url=jdbc:mysql://localhost:3306/futureme_db?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.config.import=optional:classpath:local.properties
 
# ---------- JPA / Hibernate ----------
# update = create the table if it is missing, never drop existing data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
 
# ---------- Thymeleaf ----------
# cache=false lets you edit a template and simply refresh the browser while developing
spring.thymeleaf.cache=false
 
# ---------- Error pages ----------
server.error.include-message=always
server.error.include-binding-errors=always
 
# ---------- FutureMe ----------
# The time zone in which unlock times are entered, stored and compared.
# Use any IANA zone id, for example Asia/Kolkata, Europe/London, America/New_York.
app.timezone=Asia/Kolkata

