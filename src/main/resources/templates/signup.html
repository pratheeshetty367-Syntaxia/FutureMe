
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Sign up')}"></head>
<body>
<header th:replace="~{fragments :: navbar}"></header>

<main class="container fm-auth-page">
    <section class="fm-auth-card">
        <p class="fm-eyebrow">A NEW LITTLE BEGINNING ✧</p>
        <h1>Create your FutureMe account 💌</h1>
        <p class="muted">Give your future self something to look forward to.</p>

        <p class="fm-auth-error"
           th:if="${errorMessage}"
           th:text="${errorMessage}"></p>

        <form th:action="@{/signup}" method="post" class="fm-auth-form">
            <label for="name">Your name</label>
            <input id="name" name="name" type="text"
                   maxlength="80" autocomplete="name" required>

            <label for="email">Email address</label>
            <input id="email" name="email" type="email"
                   maxlength="190" autocomplete="email" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   minlength="8" maxlength="72"
                   autocomplete="new-password" required>
            <small>Use at least 8 characters.</small>

            <label for="confirmPassword">Confirm password</label>
            <input id="confirmPassword" name="confirmPassword"
                   type="password" minlength="8" maxlength="72"
                   autocomplete="new-password" required>

            <button type="submit" class="btn btn-primary">
                Create my account ✨
            </button>
        </form>

        <p class="fm-auth-switch">
            Already have an account? <a th:href="@{/login}">Log in</a>
        </p>
    </section>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
